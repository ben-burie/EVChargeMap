<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV ChargeMap</title>
    <link rel="stylesheet" href="styles/cars.css">
</head>
<body>
    <div class="page-title">My Cars Page</div>
    
    <div class="container">
        <div class="page-header">
            <h1>My Cars</h1>
            <button class="btn btn-secondary" id="myTripsBtn">My Trips</button>
        </div>
        
        <div class="cars-section">
            <div class="search-bar">
                <label for="carSearch">Car:</label>
                <select id="carSearch" class="car-dropdown">
                    <option value="">Car Search</option>
                    <option value="tesla-x">Tesla Model X</option>
                    <option value="tesla-y">Tesla Model Y</option>
                    <option value="tesla-z">Tesla Model Z</option>
                </select>
            </div>
            
            <div class="add-section">
                <button class="btn-add" id="addBtn">Add</button>
                
                <table class="cars-table" id="carsTable">
                    <thead>
                        <tr>
                            <th></th>
                            <th>Car Name</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Tesla Model X</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Tesla Model Y</td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td>Tesla Model Z</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="scripts/cars.js"></script>
</body>
</html>
