<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV ChargeMap</title>
    <link rel="stylesheet" href="styles/cars.css">
</head>
<body>
    <div class="page-title">My Cars Page</div>
    
    <div class="container">
        <div class="page-header">
            <h1>My Cars</h1>
            <button class="btn btn-secondary" id="myTripsBtn">My Trips</button>
        </div>
        
        <div class="cars-section">
            
            <div class="add-section">
                <button class="btn-add" id="addBtn">Add</button>
                
                <table class="cars-table" id="carsTable">
                    <thead>
                        <tr>
                            <th></th>
                            <th>Car Name</th>
                            <th>Range (on a full charge)</th>
                        </tr>
                    </thead>
                    <tbody id="carsTableBody">
                        <!-- Cars will be populated here dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="addCarModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Car to Your Account</h2>
                <span class="close" id="closeModalBtn">&times;</span>
            </div>
            <div class="modal-body">
                <label for="addCarDropdown">Select a Car:</label>
                <select id="addCarDropdown" class="car-dropdown">
                    <option value="">Select a car</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
                <button class="btn btn-primary" id="confirmAddBtn">Add Car</button>
            </div>
        </div>
    </div>

    <script src="scripts/cars.js"></script>
</body>
</html>
