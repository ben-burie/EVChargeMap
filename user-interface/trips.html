<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV ChargeMap</title>
    <link rel="stylesheet" href="styles/trips.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1>Trips Home Page</h1>
        </header>

        <div class="trips-section">
            <div class="section-header">
                <h2>My Trips</h2>
                <div class="header-buttons">
                    <button class="btn btn-secondary" id="myCarsBtn">My Cars</button>
                    <button class="btn btn-secondary" id="logOutBtn">Log Out</button>
                </div>
            </div>

            <table class="trips-table">
                <thead>
                    <tr>
                        <th>Trip ID</th>
                        <th>Trip Name</th>
                        <th>Start Location</th>
                        <th>End Location</th>
                    </tr>
                </thead>
                <tbody id="tripsTableBody">
                    <!-- Trips will be dynamically added here -->
                </tbody>
            </table>

            <button class="btn btn-primary" id="createNewTripBtn" onclick="openTripStop()">Create New Trip</button>
        </div>
    </div>

        <div class="modal-overlay" id="tripModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Trip Details</div>
                <div class="modal-car" id="modalCar">Selected car: </div>
            </div>
            <div class="modal-body">
                <table>
                    <thead>
                        <tr>
                            <th>Stop Number</th>
                            <th>Station Name</th>
                            <th>Station City</th>
                            <th>Station State</th>
                        </tr>
                    </thead>
                    <tbody id="stopsTableBody">
                        <!-- Rows will be inserted here -->
                    </tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button class="close-btn" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="scripts/trips.js"></script>

</body>
</html>
